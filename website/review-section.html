<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Write Review - BulakenaGarden (Review Demo)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--green-deep:#1a3d2b;--green-mid:#2d6a4f;--accent:#40916c;--muted:#6b8f71}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(180deg,#f6fbf8,#f0faf5);padding:28px}
.card-review{max-width:880px;margin:0 auto}
.product-thumb{width:86px;height:86px;object-fit:cover;border-radius:10px;border:1px solid rgba(26,61,43,0.06)}
.review-modal .modal-content{border-radius:14px;overflow:hidden}
.review-modal .modal-header{background:linear-gradient(135deg,var(--green-deep),var(--green-mid));color:#fff;border-bottom:none}
.review-modal .modal-title{font-family:'Playfair Display',serif;font-size:20px}
.star-row{display:flex;gap:6px;align-items:center}
.star{font-size:28px;cursor:pointer;color:#ddd}
.star.selected{color:gold;text-shadow:0 1px 0 rgba(0,0,0,0.15)}
.image-preview{max-width:120px;max-height:120px;object-fit:cover;border-radius:8px;border:1px solid #e6efe8}
.file-drop{border:2px dashed rgba(64,145,108,0.12);padding:10px;border-radius:8px;background:#fbfff9}
.anonymous-toggle{display:flex;gap:8px;align-items:center}
.btn-submit{background:var(--accent);border:none;color:#fff}
.small-muted{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>

<div class="card card-review shadow-sm p-3">
  <div class="d-flex align-items-center gap-3">
    <img src="../images/productpreview3.jpg" alt="Product" class="product-thumb" id="demoProdImg">
    <div class="flex-grow-1">
      <h5 class="mb-1" id="demoProdTitle">Product: Serene Monstera (Small)</h5>
      <div class="small-muted">Order: <strong>ORD-20260228-001</strong> ? Status: <span class="badge bg-success">Delivered</span></div>
    </div>
    <div>
      <button class="btn btn-outline-success" id="writeReviewBtn">Write a review</button>
    </div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal fade review-modal" id="reviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title">Write a review</div>
          <div class="small-muted">Tell other shoppers about your purchase</div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-3 align-items-start mb-3">
          <img src="../images/productpreview3.jpg" alt="Product" class="product-thumb" id="modalProdImg">
          <div>
            <div id="modalProdTitle" style="font-family:'Playfair Display',serif;font-size:18px">Product: Serene Monstera (Small)</div>
            <div class="small-muted">Ordered: <strong id="modalOrderId">ORD-20260228-001</strong></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Rate your purchase</label>
          <div class="star-row" id="starRow">
            <span class="star" data-value="1">?</span>
            <span class="star" data-value="2">?</span>
            <span class="star" data-value="3">?</span>
            <span class="star" data-value="4">?</span>
            <span class="star" data-value="5">?</span>
            <small class="ms-3 small-muted" id="ratingLabel">0 of 5</small>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Product quality (your thoughts)</label>
          <textarea class="form-control" id="reviewText" rows="4"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Add a photo or video (optional)</label>
          <div class="d-flex gap-3 align-items-center">
            <div class="file-drop flex-grow-1">
              <input type="file" id="mediaInput" accept="image/*,video/*" style="width:100%;" />
              <div class="small-muted mt-2">You may upload one image or short video (max 10MB).</div>
            </div>
            <div id="mediaPreview" style="min-width:120px"></div>
          </div>
        </div>

        <div class="mb-3 anonymous-toggle">
          <input type="checkbox" id="isAnonymous" />
          <label for="isAnonymous" class="small-muted">Post review anonymously</label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-submit" id="submitReviewBtn">Submit review</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function(){
  const writeBtn = document.getElementById('writeReviewBtn');
  const reviewModalEl = document.getElementById('reviewModal');
  const bsModal = new bootstrap.Modal(reviewModalEl);
  const starRow = document.getElementById('starRow');
  const stars = Array.from(starRow.querySelectorAll('.star'));
  const ratingLabel = document.getElementById('ratingLabel');
  const mediaInput = document.getElementById('mediaInput');
  const mediaPreview = document.getElementById('mediaPreview');
  const submitBtn = document.getElementById('submitReviewBtn');
  const reviewText = document.getElementById('reviewText');
  const isAnonymous = document.getElementById('isAnonymous');

  const demoProdImg = document.getElementById('demoProdImg');
  const demoProdTitle = document.getElementById('demoProdTitle');
  const modalProdImg = document.getElementById('modalProdImg');
  const modalProdTitle = document.getElementById('modalProdTitle');
  const modalOrderId = document.getElementById('modalOrderId');

  let currentProduct = { id: '', orderId: '' };
  let selectedRating = 0;

  function withProductPrefix(title) {
    const t = String(title || '').trim();
    if (!t) return 'Product';
    if (/^product\b/i.test(t)) return t;
    return 'Product: ' + t;
  }

  let sessionUserCache = { name: '', email: '' };
  function getSessionUser() {
    return sessionUserCache;
  }

  function loadSessionUser() {
    if (window.BulakenaAuth && typeof window.BulakenaAuth.refreshSession === 'function') {
      return window.BulakenaAuth.refreshSession({ silent: true }).then(() => {
        const user = window.BulakenaAuth.getCurrentUser ? window.BulakenaAuth.getCurrentUser() : null;
        sessionUserCache = user ? { name: String(user.name || ''), email: String(user.email || '') } : { name: '', email: '' };
        return sessionUserCache;
      }).catch(() => sessionUserCache);
    }
    return fetch('api/session_check.php', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(data => {
        const user = data && data.authenticated && data.user ? data.user : null;
        sessionUserCache = user ? { name: String(user.name || ''), email: String(user.email || '') } : { name: '', email: '' };
        return sessionUserCache;
      })
      .catch(() => sessionUserCache);
  }

  function loadProductFromUrl() {
    try {
      const sp = new URLSearchParams(window.location.search);
      const pid = sp.get('product_id') || sp.get('id') || '';
      const title = sp.get('title') || '';
      const img = sp.get('img') || '';
      const orderId = sp.get('order_id') || sp.get('orderId') || '';

      currentProduct.id = pid;
      currentProduct.orderId = orderId;

      if (title) {
        if (demoProdTitle) demoProdTitle.textContent = withProductPrefix(title);
        if (modalProdTitle) modalProdTitle.textContent = withProductPrefix(title);
      }
      if (img) {
        if (demoProdImg) demoProdImg.src = img;
        if (modalProdImg) modalProdImg.src = img;
      }
      if (orderId && modalOrderId) modalOrderId.textContent = orderId;
    } catch (e) { /* ignore */ }
  }

  loadProductFromUrl();
  loadSessionUser();

  writeBtn.addEventListener('click', function(){
    // sync modal header with card values
    if (demoProdImg && modalProdImg) modalProdImg.src = demoProdImg.src;
    if (demoProdTitle && modalProdTitle) modalProdTitle.textContent = withProductPrefix(demoProdTitle.textContent || '');
    bsModal.show();
  });

  stars.forEach(star => {
    star.addEventListener('click', function(){
      selectedRating = parseInt(this.dataset.value);
      stars.forEach(s => s.classList.remove('selected'));
      for(let i=0;i<selectedRating;i++){
        stars[i].classList.add('selected');
      }
      ratingLabel.textContent = selectedRating + " of 5";
    });
  });

  mediaInput.addEventListener('change', function(){
    const file = this.files[0];
    mediaPreview.innerHTML = "";
    if(!file) return;

    const url = URL.createObjectURL(file);
    if(file.type.startsWith('image/')){
      const img = document.createElement('img');
      img.src = url;
      img.className = "image-preview";
      mediaPreview.appendChild(img);
    } else if(file.type.startsWith('video/')){
      const video = document.createElement('video');
      video.src = url;
      video.controls = true;
      video.className = "image-preview";
      mediaPreview.appendChild(video);
    }
  });

  submitBtn.addEventListener('click', function(){
    if(selectedRating === 0){
      alert("Please select a rating.");
      return;
    }

    const orderText = modalOrderId ? (modalOrderId.textContent || '') : '';
    const fd = new FormData();
    fd.append('product_id', currentProduct.id || '');
    fd.append('order_id', currentProduct.orderId || orderText || '');
    fd.append('rating', String(selectedRating));
    fd.append('text', reviewText.value || '');
    fd.append('anonymous', isAnonymous && isAnonymous.checked ? '1' : '0');
    if (mediaInput && mediaInput.files && mediaInput.files[0]) fd.append('media', mediaInput.files[0]);

    const u = getSessionUser();
    if (u && u.name) fd.append('name', u.name);
    if (u && u.email) fd.append('email', u.email);

    fetch('api/save_review.php', { method: 'POST', body: fd })
      .then(r => r.text())
      .then(txt => {
        try { const res = JSON.parse(txt); if (res && res.success) { alert("Review submitted successfully!"); } else { alert("Failed to submit review."); } }
        catch (e) { alert("Review submitted (demo)."); }
        bsModal.hide();
      })
      .catch(() => { alert("Network error submitting review."); });

    reviewText.value = "";
    mediaInput.value = "";
    mediaPreview.innerHTML = "";
    stars.forEach(s => s.classList.remove('selected'));
    ratingLabel.textContent = "0 of 5";
    selectedRating = 0;
    isAnonymous.checked = false;
  });

})();
</script>

</body>
</html>
